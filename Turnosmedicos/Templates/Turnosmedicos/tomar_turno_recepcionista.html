{% extends 'Turnosmedicos/index.html' %}
{% load widget_tweaks %}

{% block content %}

<div class="container mt-5">
    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

    <h2>Tomar un Turno</h2>

    <form method="post" id="turno-form">
        {% csrf_token %}

        <!-- Hidden inputs para enviar datos reales -->
        <input type="hidden" id="hidden-medico" name="medico">
        <input type="hidden" id="hidden-fecha" name="fecha">
        <input type="hidden" id="hidden-hora" name="hora">
        <input type="hidden" id="hidden-paciente" name="paciente_id">
        <input type="hidden" id="hidden-consultorio" name="consultorio_codigo">

<div class="mb-3">
    <label class="form-label fw-bold" style="color: #0d6efd;">Paciente (Asignar Turno a:)</label>
    <select id="paciente-select" name="paciente" class="form-select" required>
        <option value="">Seleccione un paciente</option>
        {% for pac in pacientes %}
            <option value="{{ pac.id }}">
                {{ pac.apellido }}, {{ pac.nombre }} (DNI: {{ pac.dni }})
            </option>
        {% endfor %}
    </select>
</div>

        <!-- Especialidad -->
<div class="mb-3">
    <label class="form-label">Especialidad</label>
    <select id="especialidad-select" name="especialidad" class="form-select">
        <option value="">Seleccione una especialidad</option>

        {% for esp in especialidades %}
            <option value="{{ esp.id }}">{{ esp.nombre }}</option>
        {% endfor %}
    </select>
</div>


        <!-- Médico -->
        <div class="mb-3">
            <label class="form-label">Médico</label>
            <select id="medico-select" class="form-select" disabled>
                <option value="">Seleccione un médico</option>
            </select>
        </div>

        <!-- Fecha -->
        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <select id="fecha-select" class="form-select" disabled>
                <option value="">Seleccione una fecha</option>
            </select>
        </div>

        <!-- Horarios -->
        <div class="mb-3">
            <label class="form-label">Horario</label>
            <select id="horario-select" class="form-select" disabled>
                <option value="">Seleccione un horario</option>
            </select>
        </div>

        <div class="mb-3">
    <label class="form-label">Consultorio</label>
    <select id="consultorio-select" class="form-select" disabled>
        <option value="">Seleccione un consultorio</option>
    </select>
    </div>

        <!-- Botón -->
        <button type="submit" id="confirmar-btn" class="btn btn-success" disabled>
            Confirmar Turno
        </button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {

    // Cambia paciente → guarda su ID
    $('#paciente-select').change(function() {
    var pacienteId = $(this).val();
    $('#hidden-paciente').val(pacienteId);
    });

    // ------------------------------
    // Cambia especialidad → carga médicos
    // ------------------------------
    $('#especialidad-select').change(function() {
        var esp = $(this).val();

        // RESET COMPLETO (Sumamos consultorio al reset)
        $('#medico-select').prop('disabled', true).empty().append('<option value="">Seleccione un médico</option>');
        $('#consultorio-select').prop('disabled', true).empty().append('<option value="">Seleccione un consultorio</option>');
        $('#fecha-select').prop('disabled', true).empty().append('<option value="">Seleccione una fecha</option>');
        $('#horario-select').prop('disabled', true).empty().append('<option value="">Seleccione un horario</option>');
        $('#confirmar-btn').prop('disabled', true);
        $('#hidden-consultorio').val('');

        if (esp) {
            // 1. Carga de Médicos (Tu código actual)
            $.get("{% url 'ajax_medicos' %}", { especialidad: esp }, function(data){
                $('#medico-select').prop('disabled', false);
                data.forEach(function(m){
                    $('#medico-select').append('<option value="'+m.id+'">'+m.nombre+'</option>');
                });
            });

            $('#consultorio-select').prop('disabled', false);
            // 2. 🆕 Carga de Consultorios por Especialidad
            $.get("{% url 'ajax_consultorios' %}", { especialidad: esp }, function(data){
                $('#consultorio-select').empty().append('<option value="">Seleccione un consultorio</option>');
                data.forEach(function(c){
                    // c.codigo mapea a la PK 'Codigo' y c.observaciones al texto
                    var obs = c.observaciones ? ' (' + c.observaciones + ')' : '';
                    $('#consultorio-select').append('<option value="'+c.codigo+'">Consultorio '+c.codigo+obs+'</option>');
                });
            });
        }
    });

    // ------------------------------
    // 🆕 Cambia consultorio → guarda su Código
    // ------------------------------
    $('#consultorio-select').change(function() {
        var consultorioCodigo = $(this).val();
        $('#hidden-consultorio').val(consultorioCodigo);
    });

    // ------------------------------
    // Cambia médico → cargar fechas disponibles
    // ------------------------------
    $('#medico-select').change(function() {
        var medicoId = $(this).val();

        $('#hidden-medico').val(medicoId);

        $('#fecha-select').prop('disabled', true).empty().append('<option value="">Seleccione una fecha</option>');
        $('#horario-select').prop('disabled', true).empty().append('<option value="">Seleccione un horario</option>');
        $('#confirmar-btn').prop('disabled', true);

        if (medicoId) {
            $.get("{% url 'ajax_fechas' %}", { medico: medicoId }, function(data) {
                $('#fecha-select').prop('disabled', false);

                data.forEach(function(f) {
                    $('#fecha-select').append('<option value="' + f.valor + '">' + f.texto + '</option>');
                });
            });
        }
    });

    // ------------------------------
    // Cambia fecha → cargar horarios
    // ------------------------------
    $('#fecha-select').change(function() {
        var medicoId = $('#medico-select').val();
        var fecha = $(this).val();

        $('#hidden-fecha').val(fecha);

        $('#horario-select').prop('disabled', true).empty().append('<option>Seleccione un horario</option>');
        $('#confirmar-btn').prop('disabled', true);

        if (fecha && medicoId) {
            $.get("{% url 'ajax_turnos' %}", { medico: medicoId, fecha: fecha }, function(data) {
                $('#horario-select').prop('disabled', false);

                data.forEach(function(t) {
                    $('#horario-select').append('<option value="'+t.hora+'">'+t.hora+'</option>');
                });
            });
        }
    });

    // ------------------------------
    // Cambia horario → habilita botón
    // ------------------------------
    $('#horario-select').change(function() {
        var hora = $(this).val();
        $('#hidden-hora').val(hora);

        $('#confirmar-btn').prop('disabled', !hora);
    });

});
</script>

{% endblock %}

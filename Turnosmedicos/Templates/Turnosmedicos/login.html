{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'Turnosmedicos/css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="loginbody d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="login">
        <div class="login-box">

            <h2 class="text-center">Iniciar sesión</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3 text-center">
                    <label class="form-label fw-bold">DNI</label>
                    {{ form.dni }}
                </div>

                <div class="mb-3 text-center">
                    <label class="form-label fw-bold">Contraseña</label>
                    {{ form.password }}
                </div>

                {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <div class="text-center mt-3">
                    <button id="loginbutton" type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </div>

                <!-- BOTÓN ATRÁS -->
                <div class="text-center mt-3">
                    <a href="{% url 'index' %}" class="btn btn-secondary w-100">
                        ← Atrás
                    </a>
                </div>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
